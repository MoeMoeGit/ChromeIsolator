name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ChromeIsolator.sln

      - name: Build
        run: dotnet build ChromeIsolator.sln -c Release --no-restore

      - name: Publish win-x64
        shell: pwsh
        run: ./scripts/publish-win-x64.ps1

      - name: Install WiX
        run: dotnet tool install --global wix --version 7.0.0

      - name: Build MSI
        shell: pwsh
        run: ./scripts/build-msi.ps1

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChromeIsolator-win-x64
          path: artifacts/publish/win-x64

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChromeIsolator-Setup-x64
          path: artifacts/installer/ChromeIsolator-Setup-x64.msi
